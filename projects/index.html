<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICTATE | Projects</title>
  <meta name="description" content="Manage your saved DICTATE listening sessions, projects, and study notes in your browser.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://hustler512.github.io/DICTATOR/projects">
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const target = '/projects';
      if (window.location.pathname !== target) {
        window.location.replace(target);
      }
    });
  </script>
  <style>
    body { font-family: Arial, sans-serif; background:#0f1720; color:#e8eef5; margin:0; padding:40px 20px; }
    .wrap { max-width:760px; margin:0 auto; }
    .card { background:#111d29; border:1px solid #203241; border-radius:16px; padding:28px; }
    a { color:#72d5f4; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Projects</h1>
      <p>Open the app project library to view saved sessions and continue listening to your notes.</p>
      <p><a href="/projects">Open the app projects page</a></p>
    </div>
  </div>
</body>
</html>
