  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "DICTATOR",
      "url": "https://dictator.app/",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "All",
      "description": "Private browser-based text-to-speech and reading tool for notes, PDFs, and study material.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>
  <script>
    (() => {
      const raw = localStorage.getItem('dictator_settings');
      const legacy = localStorage.getItem('dictator_theme');
      let theme = 'system';
      try { theme = raw ? JSON.parse(raw).theme || theme : legacy || theme; } catch {}
      const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=3">
